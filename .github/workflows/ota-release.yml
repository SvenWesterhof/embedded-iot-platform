name: OTA Firmware Release

on:
  push:
    tags:
      - 'v*.*.*'  # Triggers on version tags (e.g., v1.1.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0  # Fetch all history for changelog generation

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3

      - name: Build firmware
        run: |
          cd ESP32
          idf.py fullclean
          idf.py build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Calculate checksum
        id: checksum
        run: |
          CHECKSUM=$(sha256sum ESP32/build/iot_gateway.bin | cut -d' ' -f1)
          echo "CHECKSUM=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "Firmware SHA256: $CHECKSUM"

      - name: Generate categorized changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            echo "First release - no previous tag found"
            COMMITS=$(git log --pretty=format:"%s" HEAD)
          else
            echo "Generating changelog from $PREV_TAG to HEAD"
            COMMITS=$(git log --pretty=format:"%s" $PREV_TAG..HEAD)
          fi

          # Categorize commits
          FEATURES=""
          BUGFIXES=""
          DOCS=""
          REFACTOR=""
          OTHER=""

          while IFS= read -r commit; do
            if [[ $commit =~ ^feat(\(.*\))?:\ (.*) ]]; then
              FEATURES="${FEATURES}- ${BASH_REMATCH[2]}\n"
            elif [[ $commit =~ ^fix(\(.*\))?:\ (.*) ]]; then
              BUGFIXES="${BUGFIXES}- ${BASH_REMATCH[2]}\n"
            elif [[ $commit =~ ^docs(\(.*\))?:\ (.*) ]]; then
              DOCS="${DOCS}- ${BASH_REMATCH[2]}\n"
            elif [[ $commit =~ ^refactor(\(.*\))?:\ (.*) ]]; then
              REFACTOR="${REFACTOR}- ${BASH_REMATCH[2]}\n"
            else
              OTHER="${OTHER}- ${commit}\n"
            fi
          done <<< "$COMMITS"

          # Build changelog
          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### Features\n${FEATURES}\n"
          fi

          if [ -n "$BUGFIXES" ]; then
            CHANGELOG="${CHANGELOG}### Bug Fixes\n${BUGFIXES}\n"
          fi

          if [ -n "$REFACTOR" ]; then
            CHANGELOG="${CHANGELOG}### Refactoring\n${REFACTOR}\n"
          fi

          if [ -n "$DOCS" ]; then
            CHANGELOG="${CHANGELOG}### Documentation\n${DOCS}\n"
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### Other Changes\n${OTHER}\n"
          fi

          # Save to file for GitHub release
          echo -e "$CHANGELOG" > CHANGELOG.md

          # Output for workflow
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo -e "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install Python dependencies
        run: pip install boto3 paho-mqtt

      - name: Upload firmware to AWS S3
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          MQTT_BROKER: ${{ secrets.MQTT_BROKER }}
          MQTT_PORT: ${{ secrets.MQTT_PORT }}
        run: |
          python3 ESP32/tools/upload_firmware.py \
            ESP32/build/iot_gateway.bin \
            --version ${{ steps.version.outputs.VERSION }} \
            --changelog "$(cat CHANGELOG.md)" \
            --no-notify  # Don't auto-notify, let maintainer control rollout

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ESP32/build/iot_gateway.bin
            ESP32/tools/firmware_manifest.json
          body: |
            ## 🚀 Firmware Release ${{ steps.version.outputs.VERSION }}

            **Target:** ESP32-S3
            **Build Date:** ${{ github.event.repository.updated_at }}

            ---

            ## 📋 Changelog

            ${{ steps.changelog.outputs.CHANGELOG }}

            ---

            ## 📦 Build Information

            **Checksum (SHA256):** `${{ steps.checksum.outputs.CHECKSUM }}`

            **Download URL:** Firmware uploaded to AWS S3 automatically

            ---

            ## 🔧 Manual Deployment

            To notify devices about this update:
            ```bash
            python3 ESP32/tools/upload_firmware.py \
              ESP32/build/iot_gateway.bin \
              --version ${{ steps.version.outputs.VERSION }}
            ```

            For gradual rollout or testing, use `--no-notify` flag to upload without sending MQTT notifications.
          draft: false
          prerelease: false
