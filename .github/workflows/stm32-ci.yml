name: STM32 CI

# Runs on push / PR when STM32 firmware or shared code changes.
on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "STM32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.txt"
      - "tools/fix_compile_commands.py"
      - "tools/rtos_review_*.py"
      - ".github/workflows/stm32-ci.yml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "STM32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.txt"
      - "tools/fix_compile_commands.py"
      - "tools/rtos_review_*.py"

# ARM GCC 14.3 rel1 official tarball (matches local Windows development toolchain).
# Using the official tarball instead of apt-get ensures identical compiler flags/codegen.
env:
  ARM_TOOLCHAIN_VERSION: "14.3.rel1"
  ARM_TOOLCHAIN_INSTALL_DIR: "/opt/arm-toolchain"
  ARM_TOOLCHAIN_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build STM32 firmware (application + bootloader)
  # ---------------------------------------------------------------------------
  build:
    name: Build STM32 Firmware
    runs-on: ubuntu-latest

    outputs:
      sha-short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y --no-install-recommends ninja-build

      # Cache the ARM GCC toolchain tarball.
      # Fixed key: toolchain version is pinned, no need to hash dynamic content.
      - name: Cache ARM GCC toolchain
        id: cache-arm-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_INSTALL_DIR }}
          key: arm-none-eabi-gcc-${{ env.ARM_TOOLCHAIN_VERSION }}-linux-x86_64

      - name: Download ARM GCC toolchain
        if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_INSTALL_DIR"
          curl -fsSL "$ARM_TOOLCHAIN_URL" -o /tmp/arm-gcc.tar.xz
          tar -xf /tmp/arm-gcc.tar.xz -C "$ARM_TOOLCHAIN_INSTALL_DIR" --strip-components=1
          rm /tmp/arm-gcc.tar.xz

      - name: Add ARM GCC to PATH
        run: echo "$ARM_TOOLCHAIN_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Cache ccache objects for STM32 (~2-4 min saved on incremental builds).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-stm32-${{ github.sha }}
          restore-keys: |
            ccache-stm32-

      - name: Configure (CI preset)
        working-directory: STM32
        run: |
          cmake --preset CI \
            -DARM_TOOLCHAIN_DIR="$ARM_TOOLCHAIN_INSTALL_DIR/bin"

      - name: Build firmware
        working-directory: STM32
        run: cmake --build --preset CI --parallel "$(nproc)"

      - name: Print binary sizes
        working-directory: STM32
        run: |
          echo "=== Application ==="
          arm-none-eabi-size build/CI/sensor_node.elf
          echo "=== Bootloader ==="
          arm-none-eabi-size build/CI/Bootloader/bootloader.elf || true

      - name: Validate firmware flash sizes
        run: |
          python3 scripts/check_flash_sizes.py stm32 \
            STM32/build/CI/sensor_node.bin \
            --boot-binary STM32/build/CI/Bootloader/bootloader.bin \
            --json-output stm32-size-metrics.json

      - name: Upload size metrics
        uses: actions/upload-artifact@v4
        with:
          name: stm32-size-metrics
          path: stm32-size-metrics.json
          retention-days: 30

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-sensor_node-${{ steps.meta.outputs.sha_short }}
          if-no-files-found: error
          retention-days: 14
          path: |
            STM32/build/CI/sensor_node.bin
            STM32/build/CI/sensor_node.hex
            STM32/build/CI/sensor_node.elf
            STM32/build/CI/Bootloader/bootloader.bin
            STM32/build/CI/Bootloader/bootloader.hex
            STM32/build/CI/compile_commands.json

  # ---------------------------------------------------------------------------
  # Job 2: Static analysis (cppcheck + clang-tidy)
  # ---------------------------------------------------------------------------
  analyze:
    name: Static Analysis (STM32)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: sudo apt-get install -y --no-install-recommends cppcheck clang-tidy-17

      # Restore compile_commands.json from the build job artifact.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: stm32-sensor_node-${{ needs.build.outputs.sha-short }}
          path: STM32/build/CI

      - name: Run static analysis
        run: bash scripts/lint.sh stm32

  # ---------------------------------------------------------------------------
  # Job 3: RTOS vulnerability review (Claude agent)
  # Uses Claude API for semantic concurrency analysis with evidence grounding.
  # Skips gracefully if ANTHROPIC_API_KEY secret is not set (e.g. fork PRs).
  # ---------------------------------------------------------------------------
  rtos-review:
    name: RTOS Review (STM32)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      # Determine which C/H files changed and whether we have an API key.
      # Outputs: skip (reason string or 'false'), files (space-separated paths)
      - name: Resolve changed files and check prerequisites
        id: prereqs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}" 2>/dev/null || echo "")
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ]; then
            # New branch with no merge base: review all STM32/common C files (capped).
            FILES=$(find STM32 common -name "*.c" -o -name "*.h" 2>/dev/null \
              | grep -v '/build/' | head -20 | tr '\n' ' ')
          else
            FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" \
              | grep -E '^(STM32|common)/' \
              | grep -E '\.(c|h)$' \
              | grep -v '/build/' \
              | tr '\n' ' ')
          fi

          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skip=no_api_key" >> "$GITHUB_OUTPUT"
          elif [ -z "$(echo "$FILES" | tr -d ' ')" ]; then
            echo "skip=no_c_files" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.prereqs.outputs.skip != 'false'
        run: |
          if [ "${{ steps.prereqs.outputs.skip }}" = "no_api_key" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not configured — skipping RTOS review. Add it to repository secrets to enable."
          else
            echo "No C/H files changed in STM32/ or common/ — skipping RTOS review."
          fi

      # Run Claude agent (detect + self-verify + evidence grounding)
      - name: Run RTOS vulnerability review
        if: steps.prereqs.outputs.skip == 'false'
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RTOS_REVIEW_MODEL: claude-haiku-4-5-20251001
        run: |
          python tools/rtos_review_agent.py ${{ steps.prereqs.outputs.files }} \
            > /tmp/rtos_review.json

      - name: Write job summary
        if: steps.prereqs.outputs.skip == 'false'
        run: |
          if [ -f /tmp/rtos_review.json ]; then
            python tools/rtos_review_format.py /tmp/rtos_review.json >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Fail on critical findings
        if: steps.prereqs.outputs.skip == 'false'
        run: |
          REVIEW_FILE="/tmp/rtos_review.json"
          [ -f "$REVIEW_FILE" ] || exit 0
          [ -s "$REVIEW_FILE" ] || exit 0  # exit 0 if file is empty (agent crashed)

          python -c "
          import json, sys
          data = json.load(open('$REVIEW_FILE'))
          results = data if isinstance(data, list) else [data]
          blockers = []
          for r in results:
              for f in r.get('findings', []):
                  if f.get('severity') == 'CRITICAL':
                      blockers.append(f)
          if blockers:
              for b in blockers:
                  print(f\"::error file={b.get('file','?')},line={b.get('line','?')}::{b.get('rule','?')}: {b.get('title','')}\")
              sys.exit(1)
          "

  # ---------------------------------------------------------------------------
  # Job 4: Binary size delta comment (PR only)
  # Downloads current and master size metrics, posts/updates a PR comment.
  # ---------------------------------------------------------------------------
  size-report:
    name: Binary Size Report (STM32)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    permissions:
      pull-requests: write

    steps:
      - name: Download PR size metrics
        uses: actions/download-artifact@v4
        with:
          name: stm32-size-metrics
          path: metrics/pr

      # Best-effort: fetch master's latest successful size metrics for delta.
      - name: Download master size metrics
        id: dl-master
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: stm32-ci.yml
          branch: master
          name: stm32-size-metrics
          path: metrics/master
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Post size delta comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prData = JSON.parse(
              fs.readFileSync('metrics/pr/stm32-size-metrics.json', 'utf8')
            );

            let masterData = null;
            try {
              masterData = JSON.parse(
                fs.readFileSync('metrics/master/stm32-size-metrics.json', 'utf8')
              );
            } catch(e) {
              core.info('No master size metrics found — showing sizes without delta');
            }

            let body = '## STM32 Binary Size\n\n';
            body += '| Region | Size | Limit | Used | vs master |\n';
            body += '|--------|------|-------|------|----------|\n';

            for (const b of prData.binaries) {
              const mb = masterData?.binaries?.find(m => m.name === b.name);
              let deltaStr = '—';
              if (mb !== undefined) {
                const delta = b.size_bytes - mb.size_bytes;
                deltaStr = delta === 0
                  ? '±0 B'
                  : `${delta > 0 ? '+' : ''}${delta.toLocaleString()} B`;
              }
              const icon = b.size_bytes > b.limit_bytes ? '🔴'
                         : b.pct_used >= 90 ? '🟡' : '🟢';
              body += `| ${b.name} | ${b.size_bytes.toLocaleString()} B`
                    + ` | ${b.limit_bytes.toLocaleString()} B`
                    + ` | ${b.pct_used.toFixed(1)}% ${icon}`
                    + ` | ${deltaStr} |\n`;
            }

            if (masterData) {
              body += `\n_Compared with master @ \`${masterData.commit}\`_\n`;
            }

            const marker = '<!-- stm32-size-report -->';
            body = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
