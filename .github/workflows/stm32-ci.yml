name: STM32 CI

# Runs on push / PR when STM32 firmware or shared code changes.
on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "STM32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.xml"
      - "tools/rtos_review_*.py"
      - "tools/codeql/**"
      - ".github/workflows/stm32-ci.yml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "STM32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.xml"
      - "tools/rtos_review_*.py"
      - "tools/codeql/**"

# ARM GCC 14.3 rel1 official tarball (matches local Windows development toolchain).
# Using the official tarball instead of apt-get ensures identical compiler flags/codegen.
env:
  ARM_TOOLCHAIN_VERSION: "14.3.rel1"
  ARM_TOOLCHAIN_INSTALL_DIR: "/opt/arm-toolchain"
  ARM_TOOLCHAIN_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build STM32 firmware (application + bootloader)
  # ---------------------------------------------------------------------------
  build:
    name: Build STM32 Firmware
    runs-on: ubuntu-latest

    outputs:
      sha-short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y --no-install-recommends ninja-build

      # Cache the ARM GCC toolchain tarball.
      # Fixed key: toolchain version is pinned, no need to hash dynamic content.
      - name: Cache ARM GCC toolchain
        id: cache-arm-gcc
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_INSTALL_DIR }}
          key: arm-none-eabi-gcc-${{ env.ARM_TOOLCHAIN_VERSION }}-linux-x86_64

      - name: Download ARM GCC toolchain
        if: steps.cache-arm-gcc.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_INSTALL_DIR"
          curl -fsSL "$ARM_TOOLCHAIN_URL" -o /tmp/arm-gcc.tar.xz
          tar -xf /tmp/arm-gcc.tar.xz -C "$ARM_TOOLCHAIN_INSTALL_DIR" --strip-components=1
          rm /tmp/arm-gcc.tar.xz

      - name: Add ARM GCC to PATH
        run: echo "$ARM_TOOLCHAIN_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        run: arm-none-eabi-gcc --version

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Cache ccache objects for STM32 (~2-4 min saved on incremental builds).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-stm32-${{ github.sha }}
          restore-keys: |
            ccache-stm32-

      - name: Configure (CI preset)
        working-directory: STM32
        run: |
          cmake --preset CI \
            -DARM_TOOLCHAIN_DIR="$ARM_TOOLCHAIN_INSTALL_DIR/bin"

      - name: Build firmware
        working-directory: STM32
        run: cmake --build --preset CI --parallel "$(nproc)"

      - name: Print binary sizes
        working-directory: STM32
        run: |
          echo "=== Application ==="
          arm-none-eabi-size build/CI/sensor_node.elf
          echo "=== Bootloader ==="
          arm-none-eabi-size build/CI/Bootloader/bootloader.elf || true

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stm32-sensor_node-${{ steps.meta.outputs.sha_short }}
          if-no-files-found: error
          retention-days: 14
          path: |
            STM32/build/CI/sensor_node.bin
            STM32/build/CI/sensor_node.hex
            STM32/build/CI/sensor_node.elf
            STM32/build/CI/Bootloader/bootloader.bin
            STM32/build/CI/Bootloader/bootloader.hex
            STM32/build/CI/compile_commands.json

      # CodeQL database creation — wraps the same build for static analysis.
      # Rebuilds under CodeQL tracing so the database captures all compilation units.
      - name: Install CodeQL CLI
        run: |
          wget -q https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
          tar -xzf codeql-bundle-linux64.tar.gz -C /opt
          echo "/opt/codeql" >> "$GITHUB_PATH"
          rm codeql-bundle-linux64.tar.gz

      - name: Create CodeQL database
        working-directory: STM32
        run: |
          # Clean build directory so CodeQL traces a full build
          cmake --build --preset CI --target clean || true
          /opt/codeql/codeql database create ../codeql-db \
            --language=cpp \
            --command="cmake --build --preset CI --parallel $(nproc)" \
            --source-root=.. \
            --overwrite

      - name: Upload CodeQL database
        uses: actions/upload-artifact@v4
        with:
          name: codeql-db-stm32-${{ steps.meta.outputs.sha_short }}
          path: codeql-db
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Static analysis (cppcheck + clang-tidy)
  # ---------------------------------------------------------------------------
  analyze:
    name: Static Analysis (STM32)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: sudo apt-get install -y --no-install-recommends cppcheck clang-tidy-17

      # Restore compile_commands.json from the build job artifact.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: stm32-sensor_node-${{ needs.build.outputs.sha-short }}
          path: STM32/build/CI

      - name: Run static analysis
        run: bash scripts/lint.sh stm32

  # ---------------------------------------------------------------------------
  # Job 3: Hybrid RTOS review (Claude AI agent + CodeQL verification)
  # Depends on build job for CodeQL database.
  # Pipeline: agent detects → CodeQL verifies → correlator merges.
  # Fails the workflow on confirmed CRITICAL or high-confidence AGENT_ONLY.
  # Skips gracefully if ANTHROPIC_API_KEY secret is not set (e.g. fork PRs).
  # ---------------------------------------------------------------------------
  hybrid-review:
    name: Hybrid RTOS Review (STM32)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      - name: Install CodeQL CLI
        run: |
          wget -q https://github.com/github/codeql-action/releases/latest/download/codeql-bundle-linux64.tar.gz
          tar -xzf codeql-bundle-linux64.tar.gz -C /opt
          echo "/opt/codeql" >> "$GITHUB_PATH"
          rm codeql-bundle-linux64.tar.gz

      - name: Download CodeQL database
        uses: actions/download-artifact@v4
        with:
          name: codeql-db-stm32-${{ needs.build.outputs.sha-short }}
          path: codeql-db

      # Determine which C/H files changed and whether we have an API key.
      # Outputs: skip (reason string or 'false'), files (space-separated paths)
      - name: Resolve changed files and check prerequisites
        id: prereqs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}" 2>/dev/null || echo "")
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ]; then
            # New branch with no merge base: review all STM32/common C files (capped).
            FILES=$(find STM32 common -name "*.c" -o -name "*.h" 2>/dev/null \
              | grep -v '/build/' | head -20 | tr '\n' ' ')
          else
            FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" \
              | grep -E '^(STM32|common)/' \
              | grep -E '\.(c|h)$' \
              | grep -v '/build/' \
              | tr '\n' ' ')
          fi

          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skip=no_api_key" >> "$GITHUB_OUTPUT"
          elif [ -z "$(echo "$FILES" | tr -d ' ')" ]; then
            echo "skip=no_c_files" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.prereqs.outputs.skip != 'false'
        run: |
          if [ "${{ steps.prereqs.outputs.skip }}" = "no_api_key" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not configured — skipping hybrid review. Add it to repository secrets to enable."
          else
            echo "No C/H files changed in STM32/ or common/ — skipping hybrid review."
          fi

      # Step 1: Run Claude agent (detect + self-verify)
      - name: Run RTOS vulnerability review (agent)
        if: steps.prereqs.outputs.skip == 'false'
        id: agent
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tools/rtos_review_agent.py ${{ steps.prereqs.outputs.files }} \
            > /tmp/rtos_review.json

      # Step 2: Correlate agent findings with CodeQL verification
      - name: Correlate with CodeQL
        if: steps.prereqs.outputs.skip == 'false'
        id: correlate
        continue-on-error: true
        run: |
          python tools/rtos_review_correlator.py \
            --agent-results /tmp/rtos_review.json \
            --codeql-db codeql-db \
            --query-dir tools/codeql/queries/rtos/ \
            --output /tmp/hybrid_review.json

      # Step 3: Format and report (use hybrid output if available, fallback to agent-only)
      - name: Write job summary
        if: steps.prereqs.outputs.skip == 'false'
        run: |
          if [ -f /tmp/hybrid_review.json ]; then
            python tools/rtos_review_format.py /tmp/hybrid_review.json >> "$GITHUB_STEP_SUMMARY" || true
          elif [ -f /tmp/rtos_review.json ]; then
            echo "::warning::CodeQL correlation failed — showing agent-only results"
            python tools/rtos_review_format.py /tmp/rtos_review.json >> "$GITHUB_STEP_SUMMARY" || true
          fi

      # Step 4: Fail on confirmed critical or high-confidence agent-only critical
      - name: Fail on critical findings
        if: steps.prereqs.outputs.skip == 'false'
        run: |
          REVIEW_FILE="/tmp/hybrid_review.json"
          [ -f "$REVIEW_FILE" ] || REVIEW_FILE="/tmp/rtos_review.json"
          [ -f "$REVIEW_FILE" ] || exit 0

          python -c "
          import json, sys
          data = json.load(open('$REVIEW_FILE'))
          results = data if isinstance(data, list) else [data]
          blockers = []
          for r in results:
              for f in r.get('findings', []):
                  status = f.get('verification_status', 'AGENT_ONLY')
                  if status == 'DROPPED':
                      continue
                  if f.get('severity') != 'CRITICAL':
                      continue
                  # CONFIRMED: fail regardless of confidence
                  if status == 'CONFIRMED':
                      blockers.append(f)
                  # AGENT_ONLY: fail only on HIGH confidence
                  elif f.get('confidence') == 'HIGH':
                      blockers.append(f)
          if blockers:
              for b in blockers:
                  vs = b.get('verification_status', '')
                  tag = f'[{vs}] ' if vs else ''
                  print(f\"::error file={b.get('file','?')},line={b.get('line','?')}::{tag}{b.get('rule','?')}: {b.get('title','')}\")
              sys.exit(1)
          "
