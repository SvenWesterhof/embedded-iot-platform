name: HIL Tests

# Hardware-in-the-Loop tests run on physical ESP32 + STM32 hardware
# connected to the self-hosted Ubuntu server via USB.
#
# Architecture:
#   build-esp32 + build-stm32 → run on GitHub-hosted runners (have ESP-IDF / ARM GCC)
#   hil          → runs on self-hosted runner with physical hardware attached
#
# Self-hosted runner setup:
#   1. Register runner with labels: [self-hosted, linux, hil]
#   2. Install: docker, docker compose, openocd, esptool (pip)
#   3. Add runner user to 'dialout' and 'plugdev' groups for USB device access
#   4. Set HIL_SERVER_IP secret to the server's LAN IP address

on:
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "ESP32/**"
      - "STM32/**"
      - "common/**"
      - "hil/**"
      - ".github/workflows/hil-tests.yml"
  workflow_dispatch:
    inputs:
      skip_flash:
        description: "Skip flashing (use currently running firmware)"
        type: boolean
        default: false

concurrency:
  # Only one HIL run at a time — hardware is a shared resource
  group: hil-hardware
  cancel-in-progress: false

env:
  ARM_TOOLCHAIN_VERSION: "14.3.rel1"
  ARM_TOOLCHAIN_INSTALL_DIR: "/opt/arm-toolchain"
  ARM_TOOLCHAIN_URL: "https://developer.arm.com/-/media/Files/downloads/gnu/14.3.rel1/binrel/arm-gnu-toolchain-14.3.rel1-x86_64-arm-none-eabi.tar.xz"

jobs:
  # ---------------------------------------------------------------------------
  # Build ESP32 firmware
  # ---------------------------------------------------------------------------
  build-esp32:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-esp32-hil-${{ github.sha }}
          restore-keys: ccache-esp32-hil-

      - name: Setup credentials for build
        run: |
          cp ESP32/Application/credentials.h.template ESP32/Application/credentials.h
          # Inject HIL WiFi credentials so the device can connect during tests
          sed -i 's|WIFI_SSID.*|WIFI_SSID "${{ secrets.HIL_WIFI_SSID }}"|' ESP32/Application/credentials.h
          sed -i 's|WIFI_PASSWORD.*|WIFI_PASSWORD "${{ secrets.HIL_WIFI_PASSWORD }}"|' ESP32/Application/credentials.h
          # MQTT: point to local HIL broker (server LAN IP)
          sed -i 's|MQTT_BROKER_URI.*|MQTT_BROKER_URI "mqtt://${{ secrets.HIL_SERVER_IP }}:1883"|' ESP32/Application/credentials.h

      - name: Build ESP32 firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: ESP32
          command: |
            ccache --set-config=cache_dir=../.ccache
            idf.py build

      - name: Upload ESP32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: hil-esp32-firmware
          retention-days: 1
          path: |
            ESP32/build/iot_gateway.bin
            ESP32/build/iot_gateway.elf

  # ---------------------------------------------------------------------------
  # Build STM32 firmware
  # ---------------------------------------------------------------------------
  build-stm32:
    name: Build STM32 Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get install -y --no-install-recommends ninja-build

      - name: Cache ARM toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.ARM_TOOLCHAIN_INSTALL_DIR }}
          key: arm-toolchain-${{ env.ARM_TOOLCHAIN_VERSION }}

      - name: Install ARM toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$ARM_TOOLCHAIN_INSTALL_DIR"
          curl -L "$ARM_TOOLCHAIN_URL" | tar -xJ -C "$ARM_TOOLCHAIN_INSTALL_DIR" --strip-components=1

      - name: Build STM32 app + bootloader
        working-directory: STM32
        run: |
          export PATH="$ARM_TOOLCHAIN_INSTALL_DIR/bin:$PATH"
          cmake --preset CI
          cmake --build --preset CI --parallel "$(nproc)"

      - name: Upload STM32 firmware
        uses: actions/upload-artifact@v4
        with:
          name: hil-stm32-firmware
          retention-days: 1
          path: |
            STM32/build/CI/sensor_node.bin
            STM32/build/CI/Bootloader/bootloader.bin

  # ---------------------------------------------------------------------------
  # HIL Test Job (runs on physical hardware)
  # ---------------------------------------------------------------------------
  hil:
    name: HIL Tests
    needs: [build-esp32, build-stm32]
    runs-on: [self-hosted, linux, hil]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download ESP32 firmware
        uses: actions/download-artifact@v4
        with:
          name: hil-esp32-firmware
          path: hil-artifacts/esp32

      - name: Download STM32 firmware
        uses: actions/download-artifact@v4
        with:
          name: hil-stm32-firmware
          path: hil-artifacts/stm32

      - name: Create log directory
        run: mkdir -p hil/logs

      - name: Start supporting services (MQTT + firmware HTTP server)
        working-directory: hil
        run: |
          FW_DIR=${{ github.workspace }}/hil-artifacts docker compose up -d mosquitto fw-server
          # Give services a moment to start
          sleep 3

      - name: Flash STM32
        if: ${{ !inputs.skip_flash }}
        run: |
          chmod +x hil/scripts/flash_stm32.sh
          BOOTLOADER=""
          if [ -f hil-artifacts/stm32/Bootloader/bootloader.bin ]; then
            BOOTLOADER="hil-artifacts/stm32/Bootloader/bootloader.bin"
          fi
          hil/scripts/flash_stm32.sh \
            hil-artifacts/stm32/sensor_node.bin \
            $BOOTLOADER

      - name: Flash ESP32
        if: ${{ !inputs.skip_flash }}
        env:
          ESP32_PORT: /dev/ttyACM0   # ESP32-S3 built-in USB JTAG
        run: |
          chmod +x hil/scripts/flash_esp32.sh
          hil/scripts/flash_esp32.sh \
            hil-artifacts/esp32/iot_gateway.bin \
            "$ESP32_PORT"

      - name: Run HIL tests
        working-directory: hil
        env:
          HIL_ESP32_PORT: /dev/ttyACM0   # ESP32-S3 built-in USB JTAG/CDC
          HIL_STM32_PORT: /dev/ttyACM1   # STM32 ST-Link VCP
          HIL_SERVER_IP: ${{ secrets.HIL_SERVER_IP }}
          HIL_MQTT_BROKER: localhost
          HIL_SKIP_FLASH: "1"  # Already flashed in previous steps
          HIL_ESP32_FIRMWARE: ${{ github.workspace }}/hil-artifacts/esp32/iot_gateway.bin
          HIL_STM32_FIRMWARE: ${{ github.workspace }}/hil-artifacts/stm32/sensor_node.bin
          HIL_STM32_BOOTLOADER: ${{ github.workspace }}/hil-artifacts/stm32/Bootloader/bootloader.bin
          # OTA tests (optional — only run if keys are available)
          HIL_STM32_OTA_BIN: ${{ github.workspace }}/hil-artifacts/stm32/sensor_node.bin
          HIL_STM32_KEY: ${{ secrets.HIL_STM32_SIGNING_KEY_PATH }}
        run: |
          pip install -q -r requirements.txt
          pytest tests/ -v --tb=short \
            --timeout=60 \
            --junitxml=logs/hil-results.xml \
            2>&1 | tee logs/hil-output.log

      - name: Upload test results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hil-test-results-${{ github.sha }}
          retention-days: 14
          path: |
            hil/logs/hil-results.xml
            hil/logs/hil-output.log

      - name: Stop supporting services
        if: always()
        working-directory: hil
        run: docker compose down
