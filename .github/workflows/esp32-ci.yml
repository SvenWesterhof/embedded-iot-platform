name: ESP32 CI

# Runs on push / PR when ESP32 firmware or shared code changes.
# Static analysis runs after build so compile_commands.json is available.
on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "ESP32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.xml"
      - ".github/workflows/esp32-ci.yml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "ESP32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.xml"

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build ESP32 firmware
  # ---------------------------------------------------------------------------
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    outputs:
      sha-short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache the ESP-IDF toolchain (~2-3 GB). Key includes sdkconfig.defaults hash
      # so the cache invalidates when SDK config changes.
      - name: Cache ESP-IDF toolchain
        uses: actions/cache@v4
        with:
          path: ~/.espressif
          key: esp-idf-v5.5-${{ runner.os }}-${{ hashFiles('ESP32/sdkconfig.defaults') }}
          restore-keys: |
            esp-idf-v5.5-${{ runner.os }}-

      # Cache ccache objects to speed up incremental builds (~4-8 min saved).
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-esp32-${{ github.sha }}
          restore-keys: |
            ccache-esp32-

      - name: Setup dummy credentials and certificates for CI
        run: |
          # Copy credentials template (CI builds only - not for production!)
          cp ESP32/Application/credentials.h.template ESP32/Application/credentials.h


      - name: Setup and build using ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: ESP32

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-iot_gateway-${{ steps.meta.outputs.sha_short }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ESP32/build/iot_gateway.bin
            ESP32/build/iot_gateway.elf
            ESP32/build/iot_gateway.map
            ESP32/build/compile_commands.json

  # ---------------------------------------------------------------------------
  # Job 2: Static analysis (cppcheck + clang-tidy)
  # Runs after build so compile_commands.json is available via artifact download.
  # ---------------------------------------------------------------------------
  analyze:
    name: Static Analysis (ESP32)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: sudo apt-get install -y --no-install-recommends cppcheck clang-tidy-17

      # Restore compile_commands.json from the build job artifact.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp32-iot_gateway-${{ needs.build.outputs.sha-short }}
          path: ESP32/build

      - name: Run static analysis
        run: bash scripts/lint.sh esp32
