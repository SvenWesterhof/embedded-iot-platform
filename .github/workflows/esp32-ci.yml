name: ESP32 CI

# Runs on push / PR when ESP32 firmware or shared code changes.
# Static analysis runs after build so compile_commands.json is available.
on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
      - "fix/**"
    paths:
      - "ESP32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.txt"
      - "tools/fix_compile_commands.py"
      - ".github/workflows/esp32-ci.yml"
  pull_request:
    branches:
      - master
      - develop
    paths:
      - "ESP32/**"
      - "common/**"
      - "scripts/lint.sh"
      - "tools/.clang-tidy"
      - "tools/cppcheck-suppressions.txt"
      - "tools/fix_compile_commands.py"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build ESP32 firmware
  # ---------------------------------------------------------------------------
  build:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest

    outputs:
      sha-short: ${{ steps.meta.outputs.sha_short }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Cache ccache objects to speed up incremental builds.
      # The ESP-IDF action runs in Docker, so we cache a local .ccache directory
      # and mount it into the container.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-esp32-${{ github.sha }}
          restore-keys: |
            ccache-esp32-

      - name: Setup dummy credentials and certificates for CI
        run: |
          # Copy credentials template (CI builds only - not for production!)
          cp ESP32/Application/credentials.h.template ESP32/Application/credentials.h

          # Create ccache directory for Docker mount
          mkdir -p .ccache


      - name: Setup and build using ESP-IDF v5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32s3
          path: ESP32
          extra_docker_args: -v ${{ github.workspace }}/.ccache:/root/.ccache -e CCACHE_DIR=/root/.ccache -e IDF_CCACHE_ENABLE=1

      - name: Extract short SHA
        id: meta
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate firmware flash size
        run: |
          python3 scripts/check_flash_sizes.py esp32 \
            ESP32/build/iot_gateway.bin \
            --partition-csv ESP32/partitions_ota.csv \
            --json-output esp32-size-metrics.json

      - name: Upload size metrics
        uses: actions/upload-artifact@v4
        with:
          name: esp32-size-metrics
          path: esp32-size-metrics.json
          retention-days: 30

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-iot_gateway-${{ steps.meta.outputs.sha_short }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ESP32/build/iot_gateway.bin
            ESP32/build/iot_gateway.elf
            ESP32/build/iot_gateway.map
            ESP32/build/compile_commands.json

  # ---------------------------------------------------------------------------
  # Job 2: Static analysis (cppcheck + clang-tidy)
  # Runs after build so compile_commands.json is available via artifact download.
  # ---------------------------------------------------------------------------
  analyze:
    name: Static Analysis (ESP32)
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install analysis tools
        run: sudo apt-get install -y --no-install-recommends cppcheck clang-tidy-17

      # Restore compile_commands.json from the build job artifact.
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: esp32-iot_gateway-${{ needs.build.outputs.sha-short }}
          path: ESP32/build

      - name: Run static analysis
        run: bash scripts/lint.sh esp32

  # ---------------------------------------------------------------------------
  # Job 3: RTOS vulnerability review (Claude AI agent)
  # Runs independently — no build artifacts needed, can run in parallel.
  # Fails the workflow on CRITICAL findings. Skips gracefully if the
  # ANTHROPIC_API_KEY secret is not set (e.g. fork PRs).
  # ---------------------------------------------------------------------------
  rtos-review:
    name: RTOS Vulnerability Review (ESP32)
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/develop'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git diff

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic python-dotenv

      # Determine which C/H files changed and whether we have an API key.
      # Outputs: skip (reason string or 'false'), files (space-separated paths)
      - name: Resolve changed files and check prerequisites
        id: prereqs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git merge-base HEAD "origin/${{ github.event.repository.default_branch }}" 2>/dev/null || echo "")
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ]; then
            # New branch with no merge base: review all ESP32/common C files (capped).
            FILES=$(find ESP32 common -name "*.c" -o -name "*.h" 2>/dev/null \
              | grep -v '/build/' | head -20 | tr '\n' ' ')
          else
            FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" \
              | grep -E '^(ESP32|common)/' \
              | grep -E '\.(c|h)$' \
              | grep -v '/build/' \
              | tr '\n' ' ')
          fi

          echo "files=$FILES" >> "$GITHUB_OUTPUT"

          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "skip=no_api_key" >> "$GITHUB_OUTPUT"
          elif [ -z "$(echo "$FILES" | tr -d ' ')" ]; then
            echo "skip=no_c_files" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip notice
        if: steps.prereqs.outputs.skip != 'false'
        run: |
          if [ "${{ steps.prereqs.outputs.skip }}" = "no_api_key" ]; then
            echo "::notice::ANTHROPIC_API_KEY secret not configured — skipping RTOS review. Add it to repository secrets to enable."
          else
            echo "No C/H files changed in ESP32/ or common/ — skipping RTOS review."
          fi

      - name: Run RTOS vulnerability review
        if: steps.prereqs.outputs.skip == 'false'
        id: review
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python tools/rtos_review_agent.py ${{ steps.prereqs.outputs.files }} \
            > /tmp/rtos_review.json

      - name: Write job summary
        if: steps.prereqs.outputs.skip == 'false'
        run: python tools/rtos_review_format.py /tmp/rtos_review.json >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail on high-confidence critical findings
        if: steps.prereqs.outputs.skip == 'false'
        run: |
          # Only fail the build for CRITICAL + HIGH confidence findings
          python -c "
          import json, sys
          data = json.load(open('/tmp/rtos_review.json'))
          results = data if isinstance(data, list) else [data]
          blockers = [
              f for r in results for f in r.get('findings', [])
              if f.get('severity') == 'CRITICAL' and f.get('confidence') == 'HIGH'
          ]
          if blockers:
              for b in blockers:
                  print(f\"::error file={b.get('file','?')},line={b.get('line','?')}::{b.get('rule','?')}: {b.get('title','')}\")
              sys.exit(1)
          "

  # ---------------------------------------------------------------------------
  # Job 4: Binary size delta comment (PR only)
  # Downloads current and master size metrics, posts/updates a PR comment.
  # ---------------------------------------------------------------------------
  size-report:
    name: Binary Size Report (ESP32)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: build
    permissions:
      pull-requests: write

    steps:
      - name: Download PR size metrics
        uses: actions/download-artifact@v4
        with:
          name: esp32-size-metrics
          path: metrics/pr

      # Best-effort: fetch master's latest successful size metrics for delta.
      - name: Download master size metrics
        id: dl-master
        continue-on-error: true
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: esp32-ci.yml
          branch: master
          name: esp32-size-metrics
          path: metrics/master
          workflow_conclusion: success
          if_no_artifact_found: warn

      - name: Post size delta comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prData = JSON.parse(
              fs.readFileSync('metrics/pr/esp32-size-metrics.json', 'utf8')
            );

            let masterData = null;
            try {
              masterData = JSON.parse(
                fs.readFileSync('metrics/master/esp32-size-metrics.json', 'utf8')
              );
            } catch(e) {
              core.info('No master size metrics found — showing sizes without delta');
            }

            let body = '## ESP32 Binary Size\n\n';
            body += '| Partition | Size | Limit | Used | vs master |\n';
            body += '|-----------|------|-------|------|----------|\n';

            for (const b of prData.binaries) {
              const mb = masterData?.binaries?.find(m => m.name === b.name);
              let deltaStr = '—';
              if (mb !== undefined) {
                const delta = b.size_bytes - mb.size_bytes;
                deltaStr = delta === 0
                  ? '±0 B'
                  : `${delta > 0 ? '+' : ''}${delta.toLocaleString()} B`;
              }
              const icon = b.size_bytes > b.limit_bytes ? '🔴'
                         : b.pct_used >= 90 ? '🟡' : '🟢';
              body += `| ${b.name} | ${b.size_bytes.toLocaleString()} B`
                    + ` | ${b.limit_bytes.toLocaleString()} B`
                    + ` | ${b.pct_used.toFixed(1)}% ${icon}`
                    + ` | ${deltaStr} |\n`;
            }

            if (masterData) {
              body += `\n_Compared with master @ \`${masterData.commit}\`_\n`;
            }

            const marker = '<!-- esp32-size-report -->';
            body = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
