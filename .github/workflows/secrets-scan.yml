name: Secrets Scan

# Scans every push and PR for accidentally committed credentials, private keys,
# API tokens, or other secrets using Gitleaks.
# Runs on all branches so secrets are caught before they reach master.
on:
  push:
    branches:
      - master
      - develop
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - master
      - develop

jobs:
  gitleaks:
    name: Detect Secrets (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can scan all commits in the push/PR range,
          # not just the current working tree snapshot.
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          VERSION="8.21.2"
          curl -fsSL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # For pull requests: scan only the commits introduced by this PR.
      # For push events:   scan only the new commits (before → after).
      # The --config flag points at our project allowlist.
      - name: Scan for secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            LOG_OPTS="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            # New branch push — scan the HEAD commit only
            LOG_OPTS="-1 HEAD"
          else
            LOG_OPTS="${{ github.event.before }}..${{ github.event.after }}"
          fi

          gitleaks detect \
            --config .gitleaks.toml \
            --source . \
            --log-opts "$LOG_OPTS" \
            --log-level warn \
            --redact \
            --exit-code 1
