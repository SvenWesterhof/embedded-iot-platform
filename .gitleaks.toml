title = "embedded-iot-platform gitleaks configuration"

# ---------------------------------------------------------------------------
# Extend the built-in gitleaks ruleset so all default secret patterns
# (AWS keys, GCP credentials, GitHub tokens, etc.) are active.
# Without this, a custom --config file replaces all built-in rules with nothing.
# ---------------------------------------------------------------------------
[extend]
  useDefault = true

# ---------------------------------------------------------------------------
# Global allowlist: paths and patterns that are intentionally safe.
# All regexes use Go RE2 syntax.
# ---------------------------------------------------------------------------
[allowlist]
  description = "Project-specific false positive suppressions"

  # Smoke-test commits that intentionally contained fake secrets to verify
  # gitleaks detection end-to-end. The secrets were never real; the commits
  # were immediately reverted. Allowlisted by SHA so scans stay clean.
  commits = [
    "88a8687",  # smoke test 1 — intentional fake secret
    "a3d4ec7",  # smoke test 2 — fake AWS key with rules now active
    "0eec223",  # smoke test 3 — fake key without EXAMPLE suffix
  ]

  # Files that legitimately contain key-like content.
  paths = [
    # RSA public key embedded as a C string literal — public by design.
    '''ESP32/Middleware/Services/stm32_public_key\.h''',

    # Documentation showing example PEM snippets and command output.
    '''tools/RSA_SIGNATURE_SETUP\.md''',

    # Key generation scripts — contain shell commands, not actual key material.
    '''tools/generate_rsa_keys\.(sh|bat)''',

    # Credential template — contains only placeholder strings, never real values.
    '''ESP32/Application/credentials\.h\.template''',

    # Firmware manifest — contains S3 URLs and SHA256 hashes, not secrets.
    '''tools/firmware_manifest\.json''',
  ]

  # Regex patterns that are safe in this repo (applied globally).
  regexes = [
    # CMake version strings like "PROJECT_VER 1.1.0" look like nothing sensitive.
    # SHA256 checksums in firmware manifests are file hashes, not passwords.
    # Base64 RSA signatures in the manifest are firmware signatures, not credentials.
    # Suppress signature values that appear only in firmware_manifest.json
    # (already covered by the path allowlist above, but belt-and-suspenders).
    '''\"signature\":\s*\{[^}]+\"value\":\s*\"[A-Za-z0-9+/=]{20,}\"''',
  ]
